# Delivers Google's public sign-in keys to the backend, which cannot fetch them itself:
# api.adhkar.ir runs in Iran, where Google's APIs and GitHub's raw/API/CDN hosts are blocked.
# Every run fetches the keys from Google and POSTs them to the API (secret JWKS_PUSH_TOKEN,
# matching GOOGLE_JWKS_PUSH_TOKEN in the backend .env). google-jwks.json in this repo is kept as
# a readable mirror. Keys are public; the only secret is the push token.
name: Mirror Google sign-in keys

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; Google publishes new keys well before using them
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google JWKS
        run: |
          curl -fsS --retry 3 https://www.googleapis.com/oauth2/v3/certs -o jwks.new.json
          # Refuse anything that is not a non-empty RSA key set.
          jq -e '.keys | length > 0 and all(.[]; .kty == "RSA" and .kid and .n and .e)' jwks.new.json > /dev/null
          jq . jwks.new.json > google-jwks.json
          rm jwks.new.json

      - name: Push keys to the API
        env:
          JWKS_PUSH_TOKEN: ${{ secrets.JWKS_PUSH_TOKEN }}
          JWKS_PUSH_URL: ${{ vars.JWKS_PUSH_URL || 'https://api.adhkar.ir/api/internal/google-jwks' }}
        run: |
          if [ -z "$JWKS_PUSH_TOKEN" ]; then
            echo "::warning::JWKS_PUSH_TOKEN secret is not set; skipping push to the API."
            exit 0
          fi
          curl -fsS --retry 3 -X POST "$JWKS_PUSH_URL" \
            -H "Authorization: Bearer $JWKS_PUSH_TOKEN" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data @google-jwks.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- google-jwks.json; then
            echo "Keys unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-jwks.json
          git commit -m "Update mirrored Google sign-in keys"
          git push
