# Mirrors Google's public sign-in keys into google-jwks.json on main.
# The backend (api.adhkar.ir) runs in Iran, where Google's APIs are blocked, so it reads the keys
# from raw.githubusercontent.com instead. Keys are public; this file holds no secrets.
name: Mirror Google sign-in keys

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; Google publishes new keys well before using them
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google JWKS
        run: |
          curl -fsS --retry 3 https://www.googleapis.com/oauth2/v3/certs -o jwks.new.json
          # Refuse anything that is not a non-empty RSA key set.
          jq -e '.keys | length > 0 and all(.[]; .kty == "RSA" and .kid and .n and .e)' jwks.new.json > /dev/null
          jq . jwks.new.json > google-jwks.json
          rm jwks.new.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- google-jwks.json; then
            echo "Keys unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-jwks.json
          git commit -m "Update mirrored Google sign-in keys"
          git push
